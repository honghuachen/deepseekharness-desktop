<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 18px 20px;
    font: 13px/1.6 -apple-system, "PingFang SC", sans-serif;
    background: #f5f6f8; color: #1d2129;
    user-select: none;
  }
  @media (prefers-color-scheme: dark) { body { background: #17181a; color: #d6d9dd; } .card{background:#1f2124!important} }
  h1 { font-size: 15px; margin: 0 0 4px; display:flex; align-items:center; gap: 10px; }
  h1 .header-actions {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
  }
  h1 .header-actions button {
    font: 12px -apple-system, sans-serif; padding: 4px 12px; border-radius: 6px;
    border: 1px solid rgba(128,128,128,.35); background: transparent; color: inherit; cursor: pointer;
  }
  h1 .header-actions button:disabled { opacity:.5; cursor: not-allowed; }
  h1 .header-actions button:hover:not(:disabled) { background: rgba(128,128,128,.08); }
  .sub { font-size: 12px; opacity: .6; margin-bottom: 14px; }
  .card {
    background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .card h2 { font-size: 13px; margin: 0 0 10px; display:flex; align-items:center; gap:8px; }
  .row { display:flex; align-items:center; gap: 10px; flex-wrap: wrap; }
  .muted { opacity:.6; }
  .tag { display:inline-block; padding:0 8px; border-radius:9px; font-size:11px; line-height:18px; }
  .tag.rc { background: rgba(255,159,10,.16); color:#c77700; }
  .tag.alpha { background: rgba(128,128,128,.18); color: inherit; opacity:.8; }
  .tag.stable { background: rgba(47,158,68,.16); color:#2f9e44; }
  .tag.recommended { background: rgba(77,107,254,.14); color:#3b62f6; }
  .tag.pinned { background: rgba(255,159,10,.16); color:#c77700; }
  @media (prefers-color-scheme: dark) {
    .tag.rc { color:#ffb84d; }
    .tag.stable { color:#51cd6d; }
    .tag.recommended { color:#7e97ff; }
    .tag.pinned { color:#ffb84d; }
  }
  button {
    font: 12px -apple-system, sans-serif; padding: 5px 14px; border-radius: 6px;
    border: 1px solid rgba(128,128,128,.35); background: transparent; color: inherit; cursor:pointer;
  }
  button.primary { background:#4d6bfe; border-color:#4d6bfe; color:#fff; }
  button.primary:disabled, button:disabled { opacity:.45; cursor:not-allowed; }
  button.danger { background:#e5484d; border-color:#e5484d; color:#fff; }
  .error-box {
    font-size:12px; color:#d6313a; background: rgba(229,72,77,.1); border:1px solid rgba(229,72,77,.35);
    border-radius: 8px; padding: 8px 10px; margin-top: 8px;
  }
  @media (prefers-color-scheme: dark) { .error-box { color:#ff7375; } }
  .retry { font-size: 11px; padding: 2px 10px; margin-left: 8px; }
  .kernel-header { display:flex; align-items:center; gap:10px; flex-wrap: wrap; margin-bottom: 10px; }
  .kernel-header .status { font-size: 12px; }
  .kernel-header .status b { font-weight: 600; }
  .version-list {
    max-height: 380px; overflow-y: auto; border: 1px solid rgba(128,128,128,.15); border-radius: 8px;
  }
  .version-item {
    border-top: 1px solid rgba(128,128,128,.12);
  }
  .version-item:first-child { border-top: none; }
  .version-header {
    display:flex; align-items:center; gap: 8px; padding: 8px 12px;
    cursor: pointer; transition: background .12s ease;
  }
  .version-header:hover {
    background: rgba(128,128,128,.06);
  }
  .expand-arrow {
    display: inline-block; font-size: 9px; color: rgba(128,128,128,.7);
    transition: transform .18s ease; user-select: none; width: 12px; text-align: center;
  }
  .version-item.expanded .expand-arrow {
    transform: rotate(90deg);
  }
  .version-header .ver { font-family: ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; }
  .version-header .time { font-size: 11px; opacity:.55; white-space: nowrap; margin-left: 2px; }
  .version-header .spacer { flex: 1; }
  .version-header .actions { display:flex; align-items:center; gap: 6px; }

  /* 更新记录面板 */
  .changelog-panel {
    background: rgba(128,128,128,.04); border-top: 1px dashed rgba(128,128,128,.15);
    padding: 10px 14px 12px; font-size: 12px; line-height: 1.6;
  }
  @media (prefers-color-scheme: dark) {
    .changelog-panel { background: rgba(0,0,0,.18); }
  }
  .changelog-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; font-size: 11px; opacity: .75;
  }
  .changelog-title { font-weight: 600; color: #4d6bfe; }
  @media (prefers-color-scheme: dark) { .changelog-title { color: #7e97ff; } }
  .changelog-body {
    max-height: 260px; overflow-y: auto; padding-right: 6px;
  }
  .changelog-loading, .changelog-empty, .changelog-error {
    padding: 8px 0; font-size: 12px; opacity: .8;
    display: flex; align-items: center; gap: 8px;
  }
  .changelog-error { color: #d6313a; }
  @media (prefers-color-scheme: dark) { .changelog-error { color: #ff7375; } }
  .ext-link {
    color: #4d6bfe; text-decoration: none; cursor: pointer;
  }
  .ext-link:hover { text-decoration: underline; }
  @media (prefers-color-scheme: dark) { .ext-link { color: #7e97ff; } }

  /* Markdown 排版 */
  .md-heading {
    font-weight: 600; margin: 10px 0 4px; color: inherit;
  }
  .md-heading:first-child { margin-top: 0; }
  .md-h1, .md-h2 { font-size: 13px; }
  .md-h3, .md-h4 { font-size: 12px; opacity: .9; }
  .md-list {
    margin: 4px 0 8px; padding-left: 18px;
  }
  .md-list li {
    margin: 3px 0;
  }
  .md-p {
    margin: 4px 0 6px;
  }
  .md-inline-code {
    font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    background: rgba(128,128,128,.14); padding: 1px 4px; border-radius: 3px;
  }
  .md-code-block {
    background: rgba(128,128,128,.1); border-radius: 6px; padding: 6px 10px;
    font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    overflow-x: auto; margin: 6px 0;
  }
  .confirm-box {
    display:flex; align-items:center; gap: 8px; flex-wrap: wrap; font-size: 12px;
  }
  .spinner {
    display:inline-block; width:11px; height:11px;
    border: 2px solid rgba(128,128,128,.35); border-top-color: #4d6bfe;
    border-radius:50%; animation: spin .7s linear infinite; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .log-panel {
    margin-top: 10px; font: 11px/1.5 ui-monospace, Menlo, monospace;
    background: rgba(128,128,128,.08); border-radius: 8px; padding: 8px 10px;
    max-height: 120px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
  }
  .empty { padding: 18px 0; text-align:center; opacity:.55; font-size: 12px; }
</style>
</head>
<body>
  <h1>
    <span>检查更新</span>
    <div class="header-actions">
      <button id="openPluginsBtn" title="打开第三方插件管理">第三方插件管理</button>
      <button class="refresh" id="refreshBtn">刷新</button>
    </div>
  </h1>
  <div class="sub">同时检测容器（壳应用）与内核（@deepseek-ai/dsh）的可用版本。</div>

  <div class="card" id="shellCard">加载中…</div>
  <div class="card" id="kernelCard">加载中…</div>

<script>
const $ = (s, root=document) => root.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let STATE = { shell: null, kernel: null };
let switching = null; // { version, logs: string[] } | null
let switchError = null;
let confirmVersion = null; // 正在二次确认的版本号
let shellUpdate = { status: 'idle', percent: 0, error: null }; // idle | downloading | downloaded

let expandedVersions = new Set(); // 展开的版本，默认空（全部收缩）
let kernelChangelogs = null;
let changelogError = null;
let changelogLoading = false;

function inlineFormat(str) {
  return str
    .replace(/`([^`]+)`/g, '<code class="md-inline-code">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="#" class="ext-link" data-url="$2">$1</a>');
}

function formatMarkdown(content) {
  if (!content) return '';
  let text = content
    .replace(/<h[1-6][^>]*>(.*?)<\/h[1-6]>/gi, '\n### $1\n')
    .replace(/<\/?[^>]+(>|$)/g, '');
  text = esc(text);
  const lines = text.split(/\r?\n/);
  const out = [];
  let inList = false;
  for (let line of lines) {
    const trimmed = line.trim();
    if (!trimmed) {
      if (inList) { out.push('</ul>'); inList = false; }
      continue;
    }
    if (/^\[.+?\]\(#.+?\)(\s*\|\s*\[.+?\]\(#.+?\))*$/.test(trimmed)) continue;
    const headerMatch = trimmed.match(/^(#{1,6})\s+(.+)$/);
    if (headerMatch) {
      if (inList) { out.push('</ul>'); inList = false; }
      const level = Math.min(headerMatch[1].length, 4);
      out.push(`<div class="md-heading md-h${level}">${inlineFormat(headerMatch[2])}</div>`);
      continue;
    }
    const listMatch = trimmed.match(/^[-*]\s+(.+)$/);
    if (listMatch) {
      if (!inList) { out.push('<ul class="md-list">'); inList = true; }
      out.push(`<li>${inlineFormat(listMatch[1])}</li>`);
      continue;
    }
    if (inList) { out.push('</ul>'); inList = false; }
    out.push(`<p class="md-p">${inlineFormat(trimmed)}</p>`);
  }
  if (inList) out.push('</ul>');
  return out.join('');
}

function relTime(iso) {
  if (!iso) return '';
  const t = Date.parse(iso);
  if (Number.isNaN(t)) return '';
  const diff = Date.now() - t;
  const min = 60_000, hour = 3_600_000, day = 86_400_000;
  if (diff < min) return '刚刚';
  if (diff < hour) return `${Math.round(diff / min)} 分钟前`;
  if (diff < day) return `${Math.round(diff / hour)} 小时前`;
  const days = Math.round(diff / day);
  if (days < 30) return `${days} 天前`;
  const months = Math.round(days / 30);
  if (months < 12) return `${months} 个月前`;
  return `${Math.round(months / 12)} 年前`;
}

function tagFor(entry) {
  const tags = [];
  if (entry.recommended) tags.push('<span class="tag recommended">推荐</span>');
  tags.push(`<span class="tag ${esc(entry.tag)}">${esc(entry.tag)}</span>`);
  return tags.join(' ');
}

function renderShellCard() {
  const s = STATE.shell;
  if (!s) {
    $('#shellCard').innerHTML = `<h2>容器（壳应用）</h2><div class="row muted">加载中…</div>`;
    return;
  }
  const cur = `<span class="ver">v${esc(s.currentVersion)}</span>`;
  let body;
  if (!s.latest) {
    body = `<div class="row">当前版本 ${cur}</div>
      <div class="error-box">无法连接 GitHub<button class="retry" id="shellRetry">点击重试</button></div>`;
  } else if (s.latest.hasUpdate) {
    let autoPart = '';
    if (s.autoUpdateSupported) {
      if (shellUpdate.status === 'downloading') {
        autoPart = `<span class="row"><span class="spinner"></span> 下载中 ${shellUpdate.percent}%…</span>`;
      } else if (shellUpdate.status === 'downloaded') {
        autoPart = `<button class="primary" id="shellInstall">重启并覆盖安装</button>`;
      } else {
        autoPart = `<button class="primary" id="shellAutoDownload">下载更新</button>`;
      }
    }
    let errHtml = '';
    if (shellUpdate.error) {
      const errStr = String(shellUpdate.error);
      const isNetReset = /ERR_CONNECTION_RESET|ECONNRESET|ETIMEDOUT|timeout|ERR_CONNECTION_TIMED_OUT|ERR_NAME_NOT_RESOLVED|socket hang up/i.test(errStr);
      const tipHtml = isNetReset
        ? `<div class="tip" style="margin-top:6px;font-size:11px;opacity:.85;line-height:1.5">
            <b>连接受限提示：</b>国内网络访问 GitHub Release 安装包易受干扰导致连接重置。<br>
            • 建议 1：点击上方<b>「前往下载页」</b>在浏览器中直接下载安装包覆盖安装（无需卸载，配置与数据完全保留）；<br>
            • 建议 2：开启代理软件（推荐开启 <b>TUN 虚拟网卡模式</b>）后点击「重试下载」。
          </div>`
        : '';
      errHtml = `<div class="error-box">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <span><b>下载失败：</b>${esc(errStr)}</span>
          <button class="retry" id="shellDownloadRetry">重试下载</button>
        </div>
        ${tipHtml}
      </div>`;
    }
    body = `<div class="row">当前版本 ${cur} · <span class="muted">发现新版本</span> <b>v${esc(s.latest.latestTag)}</b></div>
      <div class="row" style="margin-top:8px">
        ${autoPart}
        <button id="shellDownloadPage">前往下载页</button>
      </div>
      ${errHtml}`;
  } else {
    body = `<div class="row">当前版本 ${cur} · <span class="muted">容器已是最新版本</span></div>`;
  }
  $('#shellCard').innerHTML = `<h2>容器（壳应用）</h2>${body}`;
  $('#shellRetry')?.addEventListener('click', refresh);
  $('#shellDownloadRetry')?.addEventListener('click', startShellAutoDownload);
  $('#shellDownloadPage')?.addEventListener('click', () => {
    if (s.latest?.htmlUrl) window.updateAPI.openExternal(s.latest.htmlUrl);
  });
  $('#shellAutoDownload')?.addEventListener('click', startShellAutoDownload);
  $('#shellInstall')?.addEventListener('click', () => {
    const btn = $('#shellInstall');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 正在退出并自动安装…';
    }
    window.updateAPI.installShellUpdate();
  });
}

async function startShellAutoDownload() {
  shellUpdate = { status: 'downloading', percent: 0, error: null };
  renderShellCard();
  const res = await window.updateAPI.downloadShellUpdate();
  shellUpdate = res.ok
    ? { status: 'downloaded', percent: 100, error: null }
    : { status: 'idle', percent: 0, error: res.error || '下载失败' };
  renderShellCard();
}

function kernelStatusLine() {
  const k = STATE.kernel;
  const activeLabel = k.activeVersion ? `v${esc(k.activeVersion)}` : '未知';
  if (k.pinnedVersion) {
    return `<span class="status">当前激活 <b>${activeLabel}</b> · <span class="tag pinned">已固定</span></span>
      <button id="clearPinBtn" ${switching ? 'disabled' : ''}>恢复自动跟随最新推荐版</button>`;
  }
  return `<span class="status">当前激活 <b>${activeLabel}</b> · <span class="tag recommended">跟随最新推荐版</span></span>`;
}

function renderChangelogPanel(version) {
  if (changelogLoading && !kernelChangelogs) {
    return `<div class="changelog-panel">
      <div class="changelog-loading"><span class="spinner"></span> 正在拉取 GitHub 更新记录…</div>
    </div>`;
  }
  if (changelogError && !kernelChangelogs) {
    return `<div class="changelog-panel">
      <div class="changelog-error">
        <span>无法获取更新记录：${esc(changelogError)}</span>
        <button class="retry" id="changelogRetryBtn">重试</button>
        <button class="retry" data-url="https://github.com/deepseek-ai/deepseek-harness/releases">前往 GitHub 查看</button>
      </div>
    </div>`;
  }
  const rel = kernelChangelogs ? kernelChangelogs[version] : null;
  if (!rel || !rel.body) {
    const ghUrl = 'https://github.com/deepseek-ai/deepseek-harness/releases';
    return `<div class="changelog-panel">
      <div class="changelog-empty">
        <span>此版本暂无 GitHub Release 记录</span>
        <a href="#" class="ext-link" data-url="${esc(ghUrl)}">前往 GitHub Releases ↗</a>
      </div>
    </div>`;
  }

  const formattedHtml = formatMarkdown(rel.body);
  const ghUrl = rel.htmlUrl || `https://github.com/deepseek-ai/deepseek-harness/releases/tag/${esc(rel.tag)}`;
  return `<div class="changelog-panel">
    <div class="changelog-header">
      <span class="changelog-title">版本更新记录</span>
      <a href="#" class="ext-link" data-url="${esc(ghUrl)}">在 GitHub 查看原文 ↗</a>
    </div>
    <div class="changelog-body">${formattedHtml}</div>
  </div>`;
}

function versionItem(entry) {
  const isExpanded = expandedVersions.has(entry.version);
  const isActive = STATE.kernel.activeVersion === entry.version;
  const busy = !!switching;
  let action;
  if (confirmVersion === entry.version) {
    action = `<div class="confirm-box">
      确定切换到 v${esc(entry.version)}？服务会短暂重启。
      <button class="primary" data-act="confirm-switch" data-version="${esc(entry.version)}">确认</button>
      <button data-act="cancel-switch">取消</button>
    </div>`;
  } else if (switching && switching.version === entry.version) {
    action = `<span class="spinner"></span> 切换中…`;
  } else if (isActive) {
    action = `<button disabled>当前使用中</button>`;
  } else {
    action = `<button data-act="ask-switch" data-version="${esc(entry.version)}" ${busy ? 'disabled' : ''}>切换到此版本</button>`;
  }
  return `<div class="version-item ${isExpanded ? 'expanded' : ''}">
    <div class="version-header" data-ver="${esc(entry.version)}" title="点击${isExpanded ? '收起' : '展开'}更新记录">
      <span class="expand-arrow">▶</span>
      <span class="ver">v${esc(entry.version)}</span>
      ${tagFor(entry)}
      <span class="time">${esc(relTime(entry.publishedAt))}</span>
      <span class="spacer"></span>
      <span class="actions">${action}</span>
    </div>
    ${isExpanded ? renderChangelogPanel(entry.version) : ''}
  </div>`;
}

function renderKernelCard() {
  const k = STATE.kernel;
  if (!k) {
    $('#kernelCard').innerHTML = `<h2>内核（@deepseek-ai/dsh）</h2><div class="row muted">加载中…</div>`;
    return;
  }
  let listHtml;
  if (!k.entries) {
    listHtml = `<div class="error-box">检测失败<button class="retry" id="kernelRetry">点击重试</button></div>`;
  } else if (k.entries.length === 0) {
    listHtml = `<div class="empty">暂无已发布版本</div>`;
  } else {
    listHtml = `<div class="version-list">${k.entries.map(versionItem).join('')}</div>`;
  }
  const errorHtml = switchError
    ? `<div class="error-box">切换失败：${esc(switchError)}</div>`
    : '';
  const logHtml = switching && switching.logs.length
    ? `<div class="log-panel">${switching.logs.map(esc).join('\n')}</div>`
    : '';
  $('#kernelCard').innerHTML = `
    <h2>内核（@deepseek-ai/dsh）</h2>
    <div class="kernel-header">${kernelStatusLine()}</div>
    ${listHtml}
    ${errorHtml}
    ${logHtml}
  `;
  $('#kernelRetry')?.addEventListener('click', refresh);
  $('#clearPinBtn')?.addEventListener('click', clearPin);
}

function render() {
  renderShellCard();
  renderKernelCard();
}

async function loadChangelogs(bypassCache = false) {
  changelogLoading = true;
  changelogError = null;
  renderKernelCard();
  try {
    const res = await window.updateAPI.getKernelChangelogs({ bypassCache });
    if (res && res.ok && res.changelogs) {
      kernelChangelogs = res.changelogs;
    } else {
      changelogError = res?.error || '获取更新记录失败';
    }
  } catch (err) {
    changelogError = String(err.message || err);
  } finally {
    changelogLoading = false;
    renderKernelCard();
  }
}

async function refresh() {
  $('#refreshBtn').disabled = true;
  try {
    STATE = await window.updateAPI.refresh();
  } finally {
    $('#refreshBtn').disabled = false;
    render();
    loadChangelogs(true);
  }
}

async function clearPin() {
  switchError = null;
  switching = { version: STATE.kernel.latestTag || STATE.kernel.activeVersion, logs: [] };
  render();
  const res = await window.updateAPI.clearPin();
  switching = null;
  if (res.ok) {
    STATE = res.state;
  } else {
    switchError = res.error || '恢复自动跟随失败';
  }
  render();
}

async function doSwitch(version) {
  confirmVersion = null;
  switchError = null;
  switching = { version, logs: [] };
  render();
  const res = await window.updateAPI.switchKernel(version, true);
  switching = null;
  if (res.ok) {
    STATE = res.state;
  } else {
    switchError = res.error || '切换失败';
  }
  render();
}

document.addEventListener('click', (ev) => {
  // 1. 外部链接
  const link = ev.target.closest('[data-url]');
  if (link) {
    ev.preventDefault();
    ev.stopPropagation();
    window.updateAPI.openExternal(link.dataset.url);
    return;
  }

  // 2. 版本切换操作按钮（切换/确认/取消）
  const act = ev.target.closest('[data-act]');
  if (act) {
    ev.stopPropagation();
    if (act.dataset.act === 'ask-switch') {
      confirmVersion = act.dataset.version;
      renderKernelCard();
    } else if (act.dataset.act === 'cancel-switch') {
      confirmVersion = null;
      renderKernelCard();
    } else if (act.dataset.act === 'confirm-switch') {
      doSwitch(act.dataset.version);
    }
    return;
  }

  // 3. Changelog 重试按钮
  const retryChangelog = ev.target.closest('#changelogRetryBtn');
  if (retryChangelog) {
    ev.stopPropagation();
    loadChangelogs(true);
    return;
  }

  // 4. 版本 Header 点击：切换收缩/展开（默认收缩）
  const header = ev.target.closest('.version-header');
  if (header) {
    const ver = header.dataset.ver;
    if (ver) {
      if (expandedVersions.has(ver)) {
        expandedVersions.delete(ver);
      } else {
        expandedVersions.add(ver);
        if (!kernelChangelogs && !changelogLoading) {
          loadChangelogs();
        }
      }
      renderKernelCard();
    }
  }
});

$('#refreshBtn').addEventListener('click', refresh);
$('#openPluginsBtn')?.addEventListener('click', () => {
  window.updateAPI.openPluginManager();
});

window.updateAPI.onInstallLog((line) => {
  if (!switching) return;
  switching.logs.push(line);
  if (switching.logs.length > 200) switching.logs.splice(0, switching.logs.length - 200);
  renderKernelCard();
});

window.updateAPI.onShellProgress((percent) => {
  if (shellUpdate.status !== 'downloading') return;
  shellUpdate.percent = percent;
  renderShellCard();
});

async function load() {
  STATE = await window.updateAPI.getState();
  render();
  loadChangelogs();
}
load();
</script>
</body>
</html>
