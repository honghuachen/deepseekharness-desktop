<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>关于 DSH Web</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1d1d1f;
    --sub: #6e6e73;
    --line: #e5e5e7;
    --link: #4d6bfe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --fg: #f2f2f2;
      --sub: #9a9a9e;
      --line: #3a3a3c;
      --link: #7c93ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap {
    padding: 28px 24px 20px;
    text-align: center;
  }
  .icon {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .version {
    font-size: 12px;
    color: var(--sub);
    margin-bottom: 18px;
  }
  .rows {
    text-align: left;
    border-top: 1px solid var(--line);
    padding-top: 14px;
    font-size: 12.5px;
    line-height: 1.9;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .row .label {
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .label .sub {
    color: var(--sub);
  }
  .gh-link {
    flex-shrink: 0;
    color: var(--link);
    text-decoration: none;
    cursor: pointer;
    font-size: 12px;
  }
  .gh-link:hover { text-decoration: underline; }
  .runtime-line {
    color: var(--sub);
    font-size: 11.5px;
    margin-top: 10px;
    word-break: break-word;
  }
  .footer {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--sub);
    text-align: center;
  }
</style>
</head>

    <h1>DSH Web</h1>
    <div class="version">版本 <span id="containerVersion">…</span></div>

    <div class="rows">
      <div class="row">
        <span class="label">容器版本：<span id="containerVersionRow">…</span></span>
        <a class="gh-link" id="containerRepoLink" title="打开 GitHub 仓库">GitHub ›</a>
      </div>
      <div class="row">
        <span class="label">内核版本：<span id="kernelVersion">…</span> <span class="sub">(@deepseek-ai/dsh)</span></span>
        <a class="gh-link" id="kernelRepoLink" title="打开 GitHub 仓库">GitHub ›</a>
      </div>
      <div class="runtime-line" id="runtimeLine"></div>
    </div>

    <div class="footer">MIT License</div>
  </div>

<script>
  function bindLink(el, url) {
    if (!url) {
      el.style.display = 'none';
      return;
    }
    el.addEventListener('click', () => window.aboutAPI.openExternal(url));
  }

  window.aboutAPI.getState().then((state) => {
    document.getElementById('containerVersion').textContent = state.containerVersion;
    document.getElementById('containerVersionRow').textContent = state.containerVersion;
    document.getElementById('kernelVersion').textContent = state.kernelVersion;
    document.getElementById('runtimeLine').textContent =
      `Electron ${state.electron} · Chromium ${state.chrome} · Node ${state.node}`;

    bindLink(document.getElementById('containerRepoLink'), state.containerRepoUrl);
    bindLink(document.getElementById('kernelRepoLink'), state.kernelRepoUrl);
  });
</script>
